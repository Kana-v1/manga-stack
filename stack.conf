# manga-stack configuration. Shell syntax (KEY="value"), read by scripts/lib.ts (the scripts and
# tools) and readahead/config.py. One list of everything that varies.
#
# A set environment variable with the same name wins over this file (e.g. for one run).

# Suwayomi-Server release that scripts/build-server.ts installs into SERVER_DIR.
# Changing it and re-running build-server.ts (or rebuild-and-start.ts) upgrades the server.
SUWAYOMI_VERSION="v2.4.2366"
SERVER_DIR="server"

# Where the scripts and tools reach the server. It also answers on the home network
# (server.ip = 0.0.0.0, see the server-ops skill, "Home network").
SUWAYOMI_URL="http://127.0.0.1:4567"

# Server data dir: server.conf, database.mv.db, extensions/, logs/, and webUI/ (the served
# UI: Tsumiru, webUIFlavor = CUSTOM). This is Suwayomi's own Linux default. The scripts give
# another value to the server as its rootDir.
TACHIDESK_DATA="${XDG_DATA_HOME:-$HOME/.local/share}/Tachidesk"

# The UI: Suwayomi-Tsumiru (Flutter), built from source with our changes (ui/README.md):
# the clone in TSUMIRU_REPO at the TSUMIRU_VERSION tag, the patches in ui/patches applied in
# the order of ui/patches/series, built by scripts/build-ui.ts with the pinned Flutter SDK.
# Tsumiru's compatibility table pairs v1.6.5 with server r2366 (SUWAYOMI_VERSION above).
# Moving to a newer version: change TSUMIRU_VERSION, `ui/patch-tool.ts check`, fix what no
# longer applies.
TSUMIRU_VERSION="v1.6.5"
TSUMIRU_REPO="ui/Suwayomi-Tsumiru"
TSUMIRU_URL="https://github.com/Suwayomi/Suwayomi-Tsumiru.git"
# Flutter SDK for that build, from the version Tsumiru pins (.fvmrc). Kept in .cache/flutter.
FLUTTER_VERSION="3.47.9"
FLUTTER_SHA256="25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a"

# Extra JVM options for the server. preferIPv4Stack: Java otherwise listens on an
# IPv6-mapped socket ([::ffff:127.0.0.1]), which WSL's NAT networking did not forward to
# Windows. Harmless with mirrored networking and on plain Linux.
JAVA_OPTS="-Djava.net.preferIPv4Stack=true"

# Extension catalogue. NOT index.min.json, which is a retired 2-entry stub.
EXTENSION_INDEX="https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.pb"

# Readahead (readahead/): prepares the next unread chapters of every library title. It
# downloads them, does the OCR, cuts the ads and upscales the pages 2x on the GPU. scripts/build-readahead.ts installs it. start.ts and
# stop.ts start and stop it together with the server.
READAHEAD_PORT="8765"
# Minutes between passes (library update, clean up, upscale ahead). 0 turns them off.
READAHEAD_INTERVAL_MINUTES="60"
# Unread chapters per title to keep upscaled, after the furthest one read
UPSCALE_AHEAD="2"
# Pages at least this wide are not upscaled (already sharp enough). Upscaled pages carry a JPEG
# comment, so they are never upscaled twice.
UPSCALE_SKIP_WIDTH="1400"
UPSCALE_JPEG_QUALITY="90"
# Model: 2x AnimeJaNai HD V3 Compact (CC BY-NC-SA 4.0), fits colour webtoon strips. ~1.2 s per
# 800x12305 strip on an RTX 3070 Ti. Any spandrel-supported .pth works. build-readahead.ts checks its sha256.
UPSCALE_MODEL="readahead/models/2x_AnimeJaNai_HD_V3_Compact.pth"
UPSCALE_MODEL_URL="https://github.com/the-database/mpv-upscale-2x_animejanai/releases/download/3.0.0/2x_AnimeJaNai_HD_V3_ModelsOnly.zip"
UPSCALE_MODEL_SHA256="af7307eee19e5982a8014dd0e4650d3bde2e25aa78d2105a4bdfd947636e4c8f"
# Text recognition (readahead/ocr.py): Hugging Face models as repository@revision, fetched into
# ~/.cache/huggingface on first use. Both Apache-2.0. The detector finds comic text and bubble
# regions. The reader is PaddleOCR-VL (0.9B): 40 of 40 sample bubbles exact in the 2026-11-09
# comparison.
OCR_DETECTOR="ogkalu/comic-text-and-bubble-detector@16e8a622f91fabc6b5b65c96d32d1183f8843546"
OCR_READER="PaddlePaddle/PaddleOCR-VL@dae2996584399c9fb7eabfeecf8acd2c7cae95b7"
# Unread chapters per title whose text each pass reads ahead (15-50 KB each, kept). 0 turns it off.
OCR_AHEAD="10"
# PyTorch build for the GPU (CUDA 13). Inside WSL, the Windows NVIDIA driver provides CUDA.
TORCH_VERSION="2.14.1"
TORCH_INDEX="https://download.pytorch.org/whl/cu130"
